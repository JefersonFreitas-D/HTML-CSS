<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto-Contatos</title>
</head><link rel="stylesheet" href="contato.css">
<body>
    <form action="" autocomplete="off">
    <fieldset>
<legend>
    Formulário de contato
</legend>

<label for="nome">Digite seu nome</label>
<input type="text" name="nome" id="nome" required minlength="7" placeholder="Seu Nome">
 

    <label for="email">Seu E-mail</label>

   <input type="email" name="email" id="email" required placeholder="Digite seu E-mail">

   <label for="assunto">Assunto</label>
   <input required type="text" name="assunto" id="assunto">

   <label for="message">Mensagem</label>
   <textarea name="message" id="message" rows="7"  maxlength="800" minlength="30" placeholder="Escreva sua mensagem abaixo"></textarea>

   <button class="btn">Enviar</button>
    </form>
       </fieldset>


</body>
</html>
